{% extends 'base.html' %}{% block content %}<div class="container-fluid py-4"><h2>Products</h2><a href="/django-admin/products/product/add/" class="btn btn-dark">Add product</a><table class="table mt-3"><tr><th>Name</th><th>SKU</th><th>Price</th><th>Status</th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.sku}}</td><td>₹{{p.selling_price}}</td><td>{{p.is_published|yesno:'Published,Hidden'}}</td></tr>{% endfor %}</table></div>{% endblock %}
