{% extends 'base.html' %}{% block content %}<div class="container py-4"><div class="d-flex justify-content-between"><h2>Shop{% if q %}: {{q}}{% endif %}</h2><select class="form-select w-auto" onchange="location='?q={{q}}&sort='+this.value"><option value="newest">Newest</option><option value="price_low">Price low to high</option><option value="price_high">Price high to low</option><option value="rating">Rating</option></select></div><div class="row g-4 mt-2">{% for p in products %}<div class="col-6 col-md-3"><div class="card h-100"><div class="ratio ratio-1x1 bg-light">{% if p.images.first %}<img src="{{p.images.first.image.url}}" class="object-fit-cover">{% else %}<div class="placeholder">No image</div>{% endif %}</div><div class="card-body"><h6>{{p.name}}</h6><div>₹{{p.selling_price}} <del class="text-muted">₹{{p.original_price}}</del></div><a href="/product/{{p.id}}/" class="btn btn-outline-dark btn-sm mt-2">View</a></div></div></div>{% empty %}<p>No matching products.</p>{% endfor %}</div></div>{% endblock %}
