{% extends 'base.html' %}{% block content %}<div class="container py-5"><h2>Checkout</h2>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<form method="post">{% csrf_token %}<div class="row"><div class="col-md-7"><input name="shipping_name" class="form-control mb-2" placeholder="Full name" required><input name="shipping_phone" class="form-control mb-2" placeholder="Phone" required><input name="shipping_line1" class="form-control mb-2" placeholder="Address" required><div class="row"><div class="col"><input name="shipping_city" class="form-control mb-2" placeholder="City" required></div><div class="col"><input name="shipping_state" class="form-control mb-2" placeholder="State" required></div><div class="col"><input name="shipping_pincode" class="form-control mb-2" placeholder="Pincode" required></div></div><select name="payment_method" class="form-select mb-3"><option value="cod">Cash on Delivery</option><option value="online">Online payment (gateway ready)</option></select><button class="btn btn-dark btn-lg">Place order</button></div><div class="col-md-5"><div class="card"><div class="card-body"><h5>Order summary</h5>{% for i in cart.items.all %}<p>{{i.variant.product.name}} × {{i.quantity}}</p>{% endfor %}</div></div></div></div></form></div>{% endblock %}
