{% extends 'base.html' %}{% block content %}<div class="container py-5"><h2>My Orders</h2>{% for o in orders %}<a class="card mb-3 text-decoration-none text-dark" href="/order/{{o.id}}/"><div class="card-body"><b>{{o.order_id}}</b><span class="badge text-bg-dark float-end">{{o.status}}</span><p class="mb-0">₹{{o.total}} · {{o.created_at}}</p></div></a>{% empty %}<p>No orders yet.</p>{% endfor %}</div>{% endblock %}
